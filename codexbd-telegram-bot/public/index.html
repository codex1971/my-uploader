<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CODEXBD | Telegram Transmission System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0a0f1e, #03060c);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Share Tech Mono', 'Orbitron', monospace;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 255, 0.02) 0px,
                rgba(0, 255, 255, 0.02) 2px,
                transparent 2px,
                transparent 6px
            );
            pointer-events: none;
            z-index: 10;
        }

        .hud-container {
            width: 100%;
            max-width: 920px;
            background: rgba(8, 18, 28, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 1.8rem;
            box-shadow: 0 0 0 2px rgba(0, 255, 255, 0.2),
                        0 0 0 6px rgba(0, 20, 30, 0.6),
                        0 20px 40px rgba(0,0,0,0.5),
                        inset 0 1px 0 rgba(255,255,255,0.05);
            border: 1px solid rgba(0, 255, 255, 0.4);
            position: relative;
            overflow: hidden;
        }

        .hud-container::before {
            content: ">";
            position: absolute;
            bottom: 15px;
            right: 25px;
            font-size: 12px;
            color: cyan;
            opacity: 0.4;
        }
        .hud-container::after {
            content: "⤬";
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 14px;
            color: #0ff;
            opacity: 0.3;
        }

        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 2px solid cyan;
            padding-bottom: 0.6rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .title-section {
            display: flex;
            gap: 1rem;
            align-items: baseline;
            flex-wrap: wrap;
        }
        .system-id {
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            letter-spacing: 2px;
            font-size: 1.8rem;
            background: linear-gradient(135deg, #aaffff, #0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 5px cyan;
        }
        .status-led {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #0f0;
            box-shadow: 0 0 8px #0f0;
            animation: pulseLed 1.5s infinite;
        }
        .status-text {
            color: #0ff;
            font-size: 0.75rem;
            letter-spacing: 1px;
            background: rgba(0,255,255,0.1);
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
        }
        .time-stamp {
            font-family: 'Share Tech Mono', monospace;
            color: #8bcbff;
            font-size: 0.8rem;
            background: #0a1424;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            border: 1px solid cyan;
        }

        .message-log {
            background: rgba(0, 10, 20, 0.55);
            border-radius: 1.2rem;
            padding: 1.2rem;
            height: 340px;
            overflow-y: auto;
            margin-bottom: 1.8rem;
            border: 1px solid rgba(0, 255, 255, 0.3);
            scroll-behavior: smooth;
        }
        .message-log::-webkit-scrollbar {
            width: 5px;
        }
        .message-log::-webkit-scrollbar-track {
            background: #07111f;
            border-radius: 10px;
        }
        .message-log::-webkit-scrollbar-thumb {
            background: cyan;
            border-radius: 10px;
        }
        .msg-item {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 1rem;
            border-left: 3px solid cyan;
            padding-left: 0.8rem;
            animation: fadeSlideUp 0.2s ease;
        }
        .msg-item.failed {
            border-left-color: #f00;
        }
        .msg-icon {
            font-size: 1.2rem;
        }
        .msg-content {
            flex: 1;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            color: #caf2ff;
            word-break: break-word;
        }
        .msg-time {
            font-size: 0.65rem;
            color: #3e7e9e;
            margin-top: 4px;
        }

        .input-panel {
            background: rgba(0, 20, 30, 0.7);
            border-radius: 1.6rem;
            padding: 1.2rem;
            border: 1px solid rgba(0, 255, 255, 0.5);
        }
        .text-input-area {
            margin-bottom: 1.2rem;
        }
        .neon-label {
            display: block;
            color: #0ff;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        .futuristic-input {
            width: 100%;
            background: #05121e;
            border: 1px solid #0ff;
            border-radius: 24px;
            padding: 0.9rem 1.2rem;
            color: #b3f0ff;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1rem;
            outline: none;
        }
        .futuristic-input:focus {
            border-color: #ff66cc;
            box-shadow: 0 0 12px rgba(0,255,255,0.6);
        }
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: space-between;
            align-items: center;
        }
        .btn-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .hud-btn {
            background: rgba(0, 30, 40, 0.7);
            border: 1px solid #0ff;
            color: #0ff;
            padding: 0.6rem 1.4rem;
            border-radius: 40px;
            font-family: 'Orbitron', monospace;
            font-weight: 500;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .hud-btn:hover:not(:disabled) {
            background: cyan;
            color: #021018;
            box-shadow: 0 0 12px cyan;
        }
        .hud-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .primary-btn {
            background: linear-gradient(145deg, #00a6c4, #005f7a);
            color: white;
        }
        .file-status {
            font-size: 0.7rem;
            color: #7df9ff;
            background: #0a142c;
            border-radius: 24px;
            padding: 0.3rem 1rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border-left: 3px solid cyan;
        }
        .hidden-file-input {
            display: none;
        }
        .status-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 11px;
            color: #0ff;
            border: 1px solid cyan;
            z-index: 100;
        }
        .telegram-badge {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 10px;
            color: #08c;
            border: 1px solid #08c;
        }

        @keyframes pulseLed {
            0% { opacity: 0.4; box-shadow: 0 0 2px #0f0; }
            100% { opacity: 1; box-shadow: 0 0 10px #0f0; }
        }
        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @media (max-width: 600px) {
            .hud-container { padding: 1rem; }
            .system-id { font-size: 1.3rem; }
            .hud-btn { padding: 0.4rem 1rem; font-size: 0.7rem; }
        }
    </style>
</head>
<body>
<div class="telegram-badge">
    📡 TELEGRAM LINKED
</div>
<div class="hud-container">
    <div class="hud-header">
        <div class="title-section">
            <span class="system-id">◈ CODEXBD TERMINAL ◈</span>
            <span class="status-text"><span class="status-led"></span> LINK ACTIVE</span>
        </div>
        <div class="time-stamp" id="liveTimestamp">00:00:00 UTC</div>
    </div>

    <div class="message-log" id="messageLog">
        <div class="msg-item">
            <div class="msg-icon">🤖</div>
            <div class="msg-content">
                <div>System ready. Send messages or files → They will be forwarded to Telegram Bot</div>
                <div class="msg-time">[ System ]</div>
            </div>
        </div>
    </div>

    <div class="input-panel">
        <div class="text-input-area">
            <div class="neon-label">✧ ENCRYPTED TRANSMISSION ✧</div>
            <input type="text" id="messageInput" class="futuristic-input" placeholder="Type your message..." autocomplete="off">
        </div>

        <div class="action-buttons">
            <div class="btn-group">
                <button id="filePickBtn" class="hud-btn">📂 PICK ANY FILE</button>
                <button id="sendBtn" class="hud-btn primary-btn">⚡ SEND TO TELEGRAM</button>
            </div>
            <div id="filePreviewStatus" class="file-status">
                <span>📁</span> <span id="fileNameDisplay">No file attached</span>
            </div>
        </div>
    </div>
</div>

<div class="status-indicator" id="serverStatus">
    🔌 CHECKING...
</div>

<input type="file" id="fileInputElement" class="hidden-file-input">

<script>
    const API_BASE_URL = '';
    const messageLog = document.getElementById('messageLog');
    const messageInput = document.getElementById('messageInput');
    const filePickBtn = document.getElementById('filePickBtn');
    const sendBtn = document.getElementById('sendBtn');
    const fileInput = document.getElementById('fileInputElement');
    const fileNameDisplay = document.getElementById('fileNameDisplay');
    const liveTimestampSpan = document.getElementById('liveTimestamp');
    const serverStatusSpan = document.getElementById('serverStatus');

    let selectedFile = null;

    function getTimestamp() {
        const now = new Date();
        return now.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute:'2-digit', second:'2-digit' }) + " UTC";
    }

    function updateLiveClock() {
        const now = new Date();
        liveTimestampSpan.innerText = now.toLocaleTimeString('en-US', { hour12: false, hour:'2-digit', minute:'2-digit', second:'2-digit' }) + " UTC";
    }
    setInterval(updateLiveClock, 1000);
    updateLiveClock();

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function addToLog(message, isError = false) {
        const logDiv = document.createElement('div');
        logDiv.className = 'msg-item';
        if (isError) logDiv.classList.add('failed');
        
        const timeStr = getTimestamp();
        logDiv.innerHTML = `
            <div class="msg-icon">${isError ? '⚠️' : '🚀'}</div>
            <div class="msg-content">
                <div>${message}</div>
                <div class="msg-time">[ ${timeStr} ]</div>
            </div>
        `;
        messageLog.appendChild(logDiv);
        messageLog.scrollTop = messageLog.scrollHeight;
        
        if (messageLog.children.length > 100) {
            messageLog.removeChild(messageLog.children[0]);
        }
    }

    function updateFileStatusBar() {
        if (selectedFile) {
            fileNameDisplay.innerText = `📄 ${selectedFile.name}  |  ${(selectedFile.size / 1024).toFixed(1)} KB`;
            fileNameDisplay.style.color = "#0ff";
        } else {
            fileNameDisplay.innerText = "No file attached";
            fileNameDisplay.style.color = "#8bcbff";
        }
    }

    function resetFileSelection() {
        selectedFile = null;
        fileInput.value = '';
        updateFileStatusBar();
    }

    async function checkServerStatus() {
        try {
            const response = await fetch(`${API_BASE_URL}/api/health`);
            if (response.ok) {
                const data = await response.json();
                if (data.telegram) {
                    serverStatusSpan.innerHTML = "✅ TELEGRAM CONNECTED";
                    serverStatusSpan.style.color = "#0f0";
                } else {
                    serverStatusSpan.innerHTML = "⚠️ BOT NOT CONFIGURED";
                    serverStatusSpan.style.color = "#ff0";
                }
                return true;
            }
        } catch (error) {
            serverStatusSpan.innerHTML = "🔴 SERVER OFFLINE";
            serverStatusSpan.style.color = "#f00";
            return false;
        }
    }

    async function sendTransmission() {
        const textMessage = messageInput.value.trim();
        
        if (!textMessage && !selectedFile) {
            addToLog("⚠️ Cannot send empty transmission", true);
            return;
        }
        
        const originalBtnText = sendBtn.innerHTML;
        sendBtn.innerHTML = "⏳ SENDING TO TELEGRAM...";
        sendBtn.disabled = true;
        
        try {
            const formData = new FormData();
            if (textMessage) {
                formData.append('message', textMessage);
            }
            if (selectedFile) {
                formData.append('file', selectedFile);
            }
            
            const response = await fetch(`${API_BASE_URL}/api/send`, {
                method: 'POST',
                body: formData
            });
            
            if (response.ok) {
                const result = await response.json();
                if (result.success) {
                    let successMsg = '';
                    if (textMessage && selectedFile) {
                        successMsg = `📨 Message & file "${escapeHtml(selectedFile.name)}" sent to Telegram Bot`;
                    } else if (textMessage) {
                        successMsg = `📨 Message sent to Telegram Bot: "${escapeHtml(textMessage.substring(0, 50))}${textMessage.length > 50 ? '...' : ''}"`;
                    } else if (selectedFile) {
                        successMsg = `📎 File "${escapeHtml(selectedFile.name)}" sent to Telegram Bot`;
                    }
                    addToLog(successMsg);
                    
                    messageInput.value = '';
                    resetFileSelection();
                } else {
                    throw new Error(result.error || 'Send failed');
                }
            } else {
                const error = await response.json();
                throw new Error(error.error || 'Server error');
            }
        } catch (error) {
            console.error('Send error:', error);
            addToLog(`❌ Transmission failed: ${escapeHtml(error.message)}`, true);
        } finally {
            sendBtn.innerHTML = originalBtnText;
            sendBtn.disabled = false;
        }
    }

    filePickBtn.addEventListener('click', () => {
        fileInput.click();
    });

    fileInput.addEventListener('change', (event) => {
        if (event.target.files && event.target.files.length > 0) {
            selectedFile = event.target.files[0];
            updateFileStatusBar();
        }
    });

    sendBtn.addEventListener('click', sendTransmission);
    
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            sendTransmission();
        }
    });

    const inputPanel = document.querySelector('.input-panel');
    inputPanel.addEventListener('dragover', (e) => {
        e.preventDefault();
        inputPanel.style.borderColor = "#ff66cc";
        inputPanel.style.boxShadow = "0 0 10px magenta";
    });
    inputPanel.addEventListener('dragleave', (e) => {
        inputPanel.style.borderColor = "rgba(0, 255, 255, 0.5)";
        inputPanel.style.boxShadow = "none";
    });
    inputPanel.addEventListener('drop', (e) => {
        e.preventDefault();
        inputPanel.style.borderColor = "rgba(0, 255, 255, 0.5)";
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
            selectedFile = e.dataTransfer.files[0];
            updateFileStatusBar();
            const dataTransfer = new DataTransfer();
            dataTransfer.items.add(selectedFile);
            fileInput.files = dataTransfer.files;
        }
    });

    checkServerStatus();
    setInterval(checkServerStatus, 30000);
</script>
</body>
</html>
