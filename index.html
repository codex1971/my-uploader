<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODEXBD | Transmission Core</title>
    <style>
        body { background: #0a0f1e; color: #00ffff; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #03060c; padding: 2rem; border: 1px solid #00ffff; box-shadow: 0 0 15px rgba(0, 255, 255, 0.3); width: 350px; text-align: center; }
        h2 { text-transform: uppercase; letter-spacing: 2px; }
        textarea, input { width: 100%; background: #0a0f1e; border: 1px solid #00ffff; color: #fff; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { background: #00ffff; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background: #ff66cc; }
    </style>
</head>
<body>

<div class="container">
    <h2>Transmission Core</h2>
    <textarea id="messageInput" placeholder="ENTER SIGNAL DATA..." rows="4"></textarea>
    <input type="file" id="fileInput">
    <button onclick="sendTransmission()">⚡ SEND NOW</button>
</div>

<script>
    async function sendTransmission() {
        const fileInput = document.getElementById('fileInput');
        const messageInput = document.getElementById('messageInput');
        
        // FormData ব্যবহার করে ফাইল ও মেসেজ একসাথে প্যাক করা হচ্ছে
        let fd = new FormData();
        if (fileInput.files[0]) {
            fd.append('file', fileInput.files[0]);
        }
        fd.append('message', messageInput.value);
        
        try {
            // সার্ভারের /upload এন্ডপয়েন্টে রিকোয়েস্ট পাঠানো
            const response = await fetch('/upload', { 
                method: 'POST', 
                body: fd 
            });
            
            const result = await response.text();
            alert("STATUS: " + result); 
        } catch (error) {
            console.error("Error:", error);
            alert("TRANSMISSION_FAILED");
        }
    }
</script>

</body>
</html>
